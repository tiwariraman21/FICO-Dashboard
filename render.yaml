# How Render builds and runs this. Same shape as the procurement dashboard.
#
# buildCommand runs once per deploy; startCommand keeps the service up and must not rebuild.

services:
  - type: web
    name: infrabeat-finance
    runtime: node
    # node:sqlite is built into Node from 22.5, so no SQLite package is needed.
    nodeVersion: 24
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run serve
    healthCheckPath: /api/health
    envVars:
      - key: DATA_SOURCE
        value: sample
      # Render serves over HTTPS, so the cookie must be HTTPS-only or sign-in silently fails.
      - key: AUTH_SECURE_COOKIE
        value: true
      - key: AUTH_DISPLAY_NAME
        value: Meera K
      # Secrets: typed into the Render dashboard, never committed.
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_TO
        sync: false
      - key: MAIL_DIRECTORY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SAP_API_KEY
        sync: false
    # The free plan has no persistent disk: approvals made in one session are gone after it
    # sleeps, and every demo starts clean. Attach a disk at /opt/render/project/src/db to keep them.
